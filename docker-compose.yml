services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - ./backend/config/.env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/v1/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      - mongo
  mongo:
    image: mongo:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      retries: 5
    volumes:
      - goodsly-mongo:/data/db
volumes:
  goodsly-mongo:
